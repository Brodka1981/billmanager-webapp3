<div class="d-flex justify-content-center align-items-start vh-100 mt-5" style="padding-top: 7rem;">
  <div class="card p-4 shadow-lg" style="width: 100%; max-width: 420px;">
    <h2 class="text-center mb-4">Reset Password</h2>

    <div *ngIf="validationMessage" class="alert alert-success">
      {{ validationMessage }}
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form *ngIf="tokenValid" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="newPassword" class="form-label">Nuova password</label>
        <input
          id="newPassword"
          type="password"
          class="form-control"
          formControlName="newPassword"
          [ngClass]="{ 'is-invalid': resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched }"
        />
        <div *ngIf="resetForm.get('newPassword')?.hasError('required') && resetForm.get('newPassword')?.touched" class="invalid-feedback">
          La password è obbligatoria.
        </div>
        <div *ngIf="resetForm.get('newPassword')?.hasError('minlength') && resetForm.get('newPassword')?.touched" class="invalid-feedback">
          La password deve contenere almeno 8 caratteri.
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="resetForm.invalid">Aggiorna password</button>
    </form>

    <div *ngIf="successMessage" class="alert alert-success mt-3">
      {{ successMessage }}
    </div>

    <div class="text-center mt-3">
      <a [routerLink]="['/login']">Torna al login</a>
    </div>
  </div>
</div>
